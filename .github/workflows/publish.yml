name: Publish full-roster client
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify pinned parser package
        shell: python
        run: |
          import base64, hashlib, io, pathlib, tarfile, urllib.request
          url = 'https://registry.npmjs.org/acorn/-/acorn-8.15.0.tgz'
          expected = 'NZyJarBfL7nWwIq+FDL6Zp/yHEhePMNnnJ0y3qfieCrmNvYct8uvtiV41UvlSe6apAfk0fY1FbWx+NwfmpvtTg=='
          with urllib.request.urlopen(url, timeout=30) as response:
              data = response.read(1048577)
          if len(data) > 1048576:
              raise RuntimeError('Parser package exceeds size limit')
          actual = base64.b64encode(hashlib.sha512(data).digest()).decode()
          if actual != expected:
              raise RuntimeError('Published parser package failed its pinned npm integrity check')
          with tarfile.open(fileobj=io.BytesIO(data), mode='r:gz') as archive:
              member = archive.getmember('package/dist/acorn.js')
              if not member.isfile() or member.size > 1048576:
                  raise RuntimeError('Invalid parser package entry')
              parser = archive.extractfile(member).read()
          print('Verified npm package; parser SHA-256:', hashlib.sha256(parser).hexdigest())
          pathlib.Path('vendor').mkdir(exist_ok=True)
          pathlib.Path('vendor/acorn.cjs').write_bytes(parser)
      - name: Verify source tools and synthetic integration tests
        run: npm test
      - name: Determine project Pages path
        shell: python
        run: |
          import os
          owner, name = os.environ['GITHUB_REPOSITORY'].split('/', 1)
          base = '/' if name.lower() == (owner + '.github.io').lower() else '/' + name + '/'
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write('PAGES_BASE_PATH=' + base + '\n')
      - name: Import supported client and complete native sprite assets
        run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy verified import artifact
        id: deployment
        uses: actions/deploy-pages@v4
