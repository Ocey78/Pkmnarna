name: Publish full-roster client
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify source tools and catalog regressions
        run: npm test
      - name: Locate a previous successful asset artifact
        id: seed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json,os,urllib.request
          api='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']
          def get(path):
              req=urllib.request.Request(api+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=20) as r:return json.load(r)
          selected=''
          try:
              for run in get('/actions/workflows/publish.yml/runs?status=success&branch=main&per_page=5')['workflow_runs']:
                  artifacts=get('/actions/runs/'+str(run['id'])+'/artifacts')['artifacts']
                  if any(a['name']=='github-pages' and not a['expired'] for a in artifacts):
                      selected=str(run['id']);break
          except Exception as e:print('No reusable seed:',str(e))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('run_id='+selected+'\n')
          print('Previous asset run:',selected or 'none; doing full upstream import')
      - uses: actions/download-artifact@v8
        id: download_seed
        if: steps.seed.outputs.run_id != ''
        continue-on-error: true
        with:
          name: github-pages
          run-id: ${{ steps.seed.outputs.run_id }}
          github-token: ${{ github.token }}
          path: .asset-seed-artifact
      - name: Extract previous immutable media for reuse
        if: steps.download_seed.outcome == 'success'
        shell: python
        run: |
          import os,pathlib,tarfile
          dest=pathlib.Path('.asset-seed').resolve();dest.mkdir(exist_ok=True)
          with tarfile.open('.asset-seed-artifact/artifact.tar') as archive:
              members=archive.getmembers()
              if any(m.issym() or m.islnk() or not (dest/m.name).resolve().is_relative_to(dest) for m in members):raise RuntimeError('Unsafe seed archive')
              if sum(m.size for m in members)>800*1024*1024:raise RuntimeError('Seed exceeds asset budget')
              archive.extractall(dest,filter='data')
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('ASSET_SEED_DIR='+str(dest)+'\n')
      - name: Determine project Pages path
        shell: python
        run: |
          import os
          owner,name=os.environ['GITHUB_REPOSITORY'].split('/',1)
          base='/' if name.lower()==(owner+'.github.io').lower() else '/'+name+'/'
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('PAGES_BASE_PATH='+base+'\n')
      - name: Import all native asset catalogs and write checksummed inventory
        run: npm run build
      - name: Install actual browser engines
        run: |
          python -m pip install playwright==1.64.1
          python -m playwright install --with-deps chromium webkit
      - name: Verify a real native CPU battle in Chromium and mobile WebKit
        run: python tests/native_assets_runtime.py
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: native-battle-and-asset-evidence
          path: |
            runtime-evidence
            dist/asset-manifest.json
            dist/build-report.json
          retention-days: 7
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy verified complete asset build
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: node scripts/prepare.mjs
      - uses: actions/download-artifact@v8
        with:
          name: github-pages
          path: .published-artifact
      - name: Read this run's verified native client
        shell: python
        run: |
          import pathlib,tarfile
          dest=pathlib.Path('dist').resolve();dest.mkdir()
          with tarfile.open('.published-artifact/artifact.tar') as archive:
              archive.extractall(dest,filter='data')
      - name: Install browser engines
        run: |
          python -m pip install playwright==1.64.1
          python -m playwright install --with-deps chromium webkit
      - name: Verify an advancing CPU duel on the actual Pages site
        env:
          GAME_TEST_URL: https://ocey78.github.io/Pkmnarna/
        run: python tests/native_assets_runtime.py
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: live-native-battle-evidence
          path: runtime-evidence
          retention-days: 7
