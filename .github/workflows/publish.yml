name: Publish Rocket Menu
on:
  push:
    branches: [main, rocket-menu-1-9-56]
  workflow_dispatch:
    inputs:
      run_tests:
        description: Run optional automated and browser tests
        type: boolean
        default: false
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: rocket-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      archive_ready: ${{ steps.archive.outputs.ready }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm test
        if: inputs.run_tests == true
      - name: Locate the exact uploaded Rocket Menu archive
        id: archive
        shell: python
        run: |
          import os,pathlib,sys
          sys.path.insert(0,'scripts')
          from rocket_host import find_extension
          try:
              archive=find_extension('.')
              ready='true'
              text='Verified Rocket Menu 1.9.56 archive: '+archive.name
          except FileNotFoundError:
              ready='false'
              text='Waiting for Rocket-Menu-Firefox-1.9.56.zip in the repository root. The current live site is unchanged. Upload the original ZIP using Add file > Upload files; this workflow will run again automatically.'
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('ready='+ready+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write(text+'\n')
          print(text)
  build:
    needs: source-checks
    if: needs.source-checks.outputs.archive_ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: .asset-seed
          key: rocket-assets-v1-${{ github.run_id }}
          restore-keys: rocket-assets-v1-
      - name: Reuse checksummed assets from this existing Pages site
        run: python scripts/seed_pages.py
      - name: Build only Rocket Menu over the verified original engine
        env:
          PAGES_BASE_PATH: /Pkmnarna/
        run: npm run build
      - name: Install browser test engines
        if: inputs.run_tests == true
        run: |
          python -m pip install playwright==1.64.1
          python -m playwright install --with-deps chromium webkit
      - name: Verify native opening and an advancing CPU battle
        if: inputs.run_tests == true
        run: |
          python tests/rocket_menu_dom.py
          python tests/native_assets_runtime.py
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: rocket-menu-evidence
          path: |
            runtime-evidence
            dist/build-report.json
          retention-days: 7
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
  verify-live:
    needs: deploy
    if: inputs.run_tests == true
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: node scripts/prepare.mjs
      - uses: actions/download-artifact@v8
        with:
          name: github-pages
          path: .published
      - name: Read this run's verified client for read-only observation
        shell: python
        run: |
          import pathlib,tarfile
          with tarfile.open('.published/artifact.tar') as t:
              for name in ['build-report.json','play-online/assets/index-BBhViti1.js']:
                  match=next(m for m in t.getmembers() if m.name.lstrip('./')==name)
                  assert match.isfile() and match.size<32*1024*1024
                  dest=pathlib.Path('dist')/name;dest.parent.mkdir(parents=True,exist_ok=True)
                  dest.write_bytes(t.extractfile(match).read())
      - run: |
          python -m pip install playwright==1.64.1
          python -m playwright install --with-deps chromium webkit
      - name: Verify the actual deployed native opening and CPU battle
        env:
          GAME_TEST_URL: https://ocey78.github.io/Pkmnarna/
        run: python tests/native_assets_runtime.py
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: live-rocket-menu-evidence
          path: runtime-evidence
          retention-days: 7
