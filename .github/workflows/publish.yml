name: Publish full-roster client
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify source tools and synthetic integration tests
        run: npm test
      - name: Determine project Pages path
        shell: python
        run: |
          import os
          owner, name = os.environ['GITHUB_REPOSITORY'].split('/', 1)
          base = '/' if name.lower() == (owner + '.github.io').lower() else '/' + name + '/'
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write('PAGES_BASE_PATH=' + base + '\n')
      - name: Import supported client and apply roster patches
        run: python scripts/build.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy verified import artifact
        id: deployment
        uses: actions/deploy-pages@v4
