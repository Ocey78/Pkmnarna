name: Prepare Rocket Menu integration
on:
  push:
    branches: [rocket-menu-1-9-56]
    paths: [.github/workflows/rocket-preparation.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: node scripts/prepare.mjs
      - uses: actions/upload-artifact@v5
        with:
          name: verified-parser
          path: vendor/acorn.cjs
          retention-days: 3
